<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Art Gallery</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.5.0/dist/aframe-extras.min.js"></script>
    <script>
      AFRAME.registerComponent('click-interactive', {
        init: function () {
          this.el.addEventListener('click', () => {
            const isZoomed = this.el.getAttribute('scale').x > 0.02;
            this.el.setAttribute('animation', {
              property: 'scale',
              to: isZoomed ? '0.005 0.005 0.005' : '0.05 0.05 0.05',
              dur: 1000
            });
            this.el.setAttribute('animation__pos', {
              property: 'position',
              to: isZoomed ? '0 0.75 0' : '0 1.6 -1',
              dur: 1000
            });
          });
        }
      });
    </script>
    <style>
      #joystick-container {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div id="joystick-container"></div>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: [click-interactive]">
      <a-assets>
        <img id="floor" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        <a-asset-item id="phoenix" src="phoenix_bird.glb"></a-asset-item>
      </a-assets>

      <a-entity id="rig" movement-controls="controls: keyboard, gamepad, touch">
        <a-entity camera position="0 1.6 0" look-controls wasd-controls="fly: false">
          <a-cursor></a-cursor>
        </a-entity>
      </a-entity>

      <a-plane color="#FFFFFF" rotation="-90 0 0" width="20" height="20"></a-plane>
      <a-box color="#808080" depth="0.2" height="6" width="20" position="0 3 -10"></a-box>
      <a-box color="#808080" depth="0.2" height="6" width="20" position="-10 3 0" rotation="0 90 0"></a-box>
      <a-box color="#808080" depth="0.2" height="6" width="20" position="10 3 0" rotation="0 90 0"></a-box>
      <a-box color="#808080" depth="0.2" height="6" width="20" position="0 3 10"></a-box>
      <a-plane color="#505050" rotation="90 0 0" width="20" height="20" position="0 6 0"></a-plane>

      <a-entity position="-5 0 -5">
        <a-cylinder color="#FFD700" radius="0.4" height="1.5"></a-cylinder>
        <a-gltf-model src="#phoenix" click-interactive position="0 0.75 0" scale="0.005 0.005 0.005" animation="property: rotation; to: 0 360 0; dur: 20000; loop: true; easing: linear"></a-gltf-model>
        <a-plane color="#FFF" width="1.5" height="0.6" position="0 0.4 0.5" rotation="-20 0 0">
          <a-text value="Phoenix Bird\n(Click to Interact)" color="#000" align="center" scale="0.5 0.5 0.5"></a-text>
        </a-plane>
      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
      <a-light type="ambient" color="#FFF" intensity="0.5"></a-light>
    </a-scene>
  </body>
</html>
